{% extends 'base.html' %}
{% block content %}
<div class="surface-card p-4 p-md-5 mx-auto my-4" style="max-width: 420px;">
    <div class="text-center mb-4">
        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 mb-2">Admin Portal</span>
        <h3 class="fw-bold">Welcome Back</h3>
        <p class="text-muted small">Sign in to manage inventory and orders</p>
    </div>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-modern w-100">Sign In</button>
    </form>
</div>
{% endblock %}
