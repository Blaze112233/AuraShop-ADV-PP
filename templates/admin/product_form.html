{% extends 'base.html' %}
{% block content %}
<div class="surface-card p-4 p-lg-5 mx-auto" style="max-width: 620px;">
    <h3 class="fw-bold mb-4">{{ 'Edit Product' if product else 'Create New Product' }}</h3>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Product Name *</label>
            <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Description *</label>
            <textarea name="description" class="form-control" rows="3" required>{{ product.description if product else '' }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold small">Price ($) *</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price if product else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold small">Stock Quantity *</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock if product else 10 }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Product Image</label>
            <input type="file" name="image" class="form-control mb-2" accept="image/*">
            <input type="text" name="image_url" class="form-control" value="{{ product.image if product else '' }}" placeholder="Or paste image URL (https://...)">
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Visibility Status</label>
            <select name="status" class="form-select">
                <option value="Active" {{ 'selected' if product and product.status == 'Active' else '' }}>Active (Visible in Store)</option>
                <option value="Inactive" {{ 'selected' if product and product.status == 'Inactive' else '' }}>Inactive (Hidden)</option>
            </select>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('admin_products') }}" class="btn btn-soft">Cancel</a>
            <button type="submit" class="btn btn-modern px-4">Save Product</button>
        </div>
    </form>
</div>
{% endblock %}
